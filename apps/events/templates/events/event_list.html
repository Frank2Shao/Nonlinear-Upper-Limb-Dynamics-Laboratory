{% extends "core/base.html" %}
{% block title %}Events | NULDL Armwrestling Club{% endblock %}
{% block content %}
  <div class="public-page">
    <section class="public-section" aria-labelledby="events-title">
      <div class="public-section__header">
        <p class="eyebrow">Club activities</p>
        <h1 id="events-title">Events</h1>
      </div>
      <nav class="button-row" aria-label="Event filters">
        <a class="button button--secondary" href="{% url 'events:list' %}?view=upcoming"{% if selected == 'upcoming' %} aria-current="page"{% endif %}>Upcoming</a>
        <a class="button button--secondary" href="{% url 'events:list' %}?view=past"{% if selected == 'past' %} aria-current="page"{% endif %}>Past</a>
      </nav>
      <div class="card-grid event-list">
        {% for event in events %}
          {% include "events/includes/event_card.html" %}
        {% empty %}
          <p>No events found.</p>
        {% endfor %}
      </div>
    </section>
  </div>
{% endblock %}
