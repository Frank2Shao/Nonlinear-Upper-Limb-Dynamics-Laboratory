{% extends "core/base.html" %}
{% block title %}Cancel registration | NULDL Armwrestling Club{% endblock %}
{% block content %}
  <div class="public-page public-page--content">
    <section class="public-section" aria-labelledby="cancellation-title">
      <p class="eyebrow">Event registration</p>
      <h1 id="cancellation-title">Cancel registration</h1>
      <p><strong>Event:</strong> {{ event.title }}</p>
      {% include "events/includes/cancellation_form.html" %}
      <p class="event-detail-actions"><a class="button button--secondary" href="{% url 'events:detail' event.slug %}">Back to event</a></p>
    </section>
  </div>
{% endblock %}
