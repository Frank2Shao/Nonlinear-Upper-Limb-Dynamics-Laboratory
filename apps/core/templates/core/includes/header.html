<header class="site-header">
  <nav class="site-nav" aria-label="Primary navigation">
    <a class="brand" href="{% url 'home' %}" aria-label="NULDL Armwrestling Club home">NULDL Armwrestling Club</a>
    <details
      class="nav-disclosure"
      open
      x-data
      x-init="if (getComputedStyle($el.querySelector('summary')).display !== 'none') $el.removeAttribute('open')"
    >
      <summary class="nav-toggle">Menu</summary>
      <div class="nav-menu">
        <ul class="nav-list">
          <li>
            <a class="nav-link" href="{% url 'home' %}"{% if nav_section == "home" %} aria-current="page"{% endif %}>Home</a>
          </li>
          <li>
            <a class="nav-link" href="{% url 'about' %}"{% if nav_section == "about" %} aria-current="page"{% endif %}>About</a>
          </li>
          <li>
            <a class="nav-link" href="{% url 'beginners_safety' %}"{% if nav_section == "beginners_safety" %} aria-current="page"{% endif %}>Beginners &amp; Safety</a>
          </li>
          <li>
            <a class="nav-link" href="{% url 'events:list' %}"{% if nav_section == "events" %} aria-current="page"{% endif %}>Events</a>
          </li>
          <li>
            <a class="nav-link" href="{% url 'members:list' %}"{% if nav_section == "members" %} aria-current="page"{% endif %}>Members</a>
          </li>
          {% if draft_risk_notice_visible %}
            <li>
              <a class="nav-link" href="{% url 'safety:risk_notice' %}"{% if nav_section == "risk_notice" %} aria-current="page"{% endif %}>Draft Risk Notice</a>
            </li>
          {% endif %}
        </ul>
        <ul class="nav-actions">
          {% if user.is_authenticated %}
            <li>
              <a class="nav-link" href="{% url 'account' %}"{% if nav_section == "account" %} aria-current="page"{% endif %}>Account</a>
            </li>
          {% else %}
            <li>
              <a class="nav-link" href="{% url 'account_login' %}"{% if nav_section == "login" %} aria-current="page"{% endif %}>Log in</a>
            </li>
            <li>
              <a class="nav-link nav-link--primary" href="{% url 'account_signup' %}"{% if nav_section == "signup" %} aria-current="page"{% endif %}>Join the Club</a>
            </li>
          {% endif %}
        </ul>
      </div>
    </details>
  </nav>
</header>
