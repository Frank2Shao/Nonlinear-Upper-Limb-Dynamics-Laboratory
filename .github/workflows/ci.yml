# Runs the same quality gate as a local `python scripts/verify_project.py`, and
# checks the Production image builds. It never deploys and uses no secrets: every
# value below is a CI-only placeholder.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        # Same image as compose.production.yaml.
        image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_DB: nuldl
          POSTGRES_USER: nuldl
          POSTGRES_PASSWORD: ci-only-placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuldl -d nuldl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_DB: nuldl_test
      DATABASE_URL: postgresql://nuldl:ci-only-placeholder@127.0.0.1:5432/nuldl
      DJANGO_SECRET_KEY: django-insecure-ci-only
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      EMAIL_HOST: smtp.example.invalid
      EMAIL_PORT: "587"
      EMAIL_HOST_USER: ci-placeholder
      EMAIL_HOST_PASSWORD: ci-placeholder
      EMAIL_USE_TLS: "true"
      DEFAULT_FROM_EMAIL: noreply@example.invalid
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.5
          uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install system libraries for Chromium
        run: |
          npm ci --ignore-scripts
          npm exec playwright -- install-deps chromium
      - name: Quality gate
        run: uv run python scripts/verify_project.py

  image:
    name: Production image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build (not pushed)
        run: docker build --tag nuldl-website:ci .
