{% extends "core/base.html" %}

{% block title %}Set password | NULDL{% endblock %}

{% block content %}
  <section class="content-narrow" aria-labelledby="set-password-title">
    <p class="eyebrow">Account security</p>
    <h1 id="set-password-title">Set password</h1>

    <div class="panel">
      <form class="stack" method="post" action="{% url 'account_set_password' %}">
        {% csrf_token %}
        {% include "account/includes/form_fields.html" with form=form %}
        {{ redirect_field }}
        <button class="button" type="submit">Set password</button>
      </form>
    </div>
  </section>
{% endblock %}
