{% extends "core/base.html" %}

{% block title %}Change password | NULDL{% endblock %}

{% block content %}
  <section class="content-narrow" aria-labelledby="change-password-title">
    <p class="eyebrow">Account security</p>
    <h1 id="change-password-title">Change password</h1>

    <div class="panel">
      <form class="stack" method="post" action="{% url 'account_change_password' %}">
        {% csrf_token %}
        {% include "account/includes/form_fields.html" with form=form %}
        {{ redirect_field }}
        <div class="button-row">
          <button class="button" type="submit">Change password</button>
          <a class="button button--quiet" href="{% url 'account' %}">Cancel</a>
        </div>
      </form>
    </div>
  </section>
{% endblock %}
