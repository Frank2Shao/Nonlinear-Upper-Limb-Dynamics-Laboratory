# Production stack for one 1 GB VPS.
#   docker compose --env-file .env.production -f compose.production.yaml <command>
# The project name keeps it apart from the development compose.yaml.
name: nuldl-production

x-app-image: &app-image nuldl-website:${IMAGE_TAG:-local}

# Each service keeps at most 3 log files of 10 MB; the oldest is discarded.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    environment:
      POSTGRES_DB: nuldl
      POSTGRES_USER: nuldl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    # PostgreSQL ERROR lines quote row values and statements, so they are not logged.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "log_min_messages=log"]
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "nuldl", "-d", "nuldl"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: *app-image
    build: .
    restart: unless-stopped
    logging: *logging
    mem_limit: 400m
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${SITE_DOMAIN:?Set SITE_DOMAIN}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${SITE_DOMAIN}
      DJANGO_ADMINS: ${DJANGO_ADMINS:?Set DJANGO_ADMINS}
      DATABASE_URL: postgresql://nuldl:${POSTGRES_PASSWORD}@db:5432/nuldl
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: "587"
      EMAIL_USE_TLS: "true"
      EMAIL_HOST_USER: ${GMAIL_ADDRESS:?Set GMAIL_ADDRESS}
      EMAIL_HOST_PASSWORD: ${GMAIL_APP_PASSWORD:?Set GMAIL_APP_PASSWORD}
      DEFAULT_FROM_EMAIL: ${GMAIL_ADDRESS}
    volumes:
      - media:/app/media
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as r; r.urlopen(r.Request('http://127.0.0.1:8000/health/', headers={'Host': os.environ['DJANGO_ALLOWED_HOSTS']}), timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Copies the image's collected files on every deploy; a named volume alone
  # would keep the first release's files.
  static:
    image: *app-image
    pull_policy: never
    restart: "no"
    logging: *logging
    network_mode: none
    command: ["cp", "-r", "/app/staticfiles/.", "/srv/static/"]
    volumes:
      - static:/srv/static

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    depends_on:
      web:
        condition: service_started
      static:
        condition: service_completed_successfully
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    # IPv4 only: Docker would report every IPv6 visitor as the gateway address,
    # which breaks per-IP rate limits. Do not add an AAAA record.
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  database:
  media:
  static:
  caddy_data:
  caddy_config:
