[project]
name = "nuldl-website"
version = "0.1.0"
description = "Website for the Nonlinear Upper Limb Dynamics Laboratory"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "django==5.2.18",
    "django-allauth==65.20.1",
    "pillow==13.0.0",
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = [
    "coverage==7.16.2",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["apps", "config"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["RUF012"]
"config/settings/*.py" = ["F403", "F405"]
